# =====================================================
# APPLICATION
# =====================================================

spring.application.name=quan-ly-phong-tro
server.port=8080

# Load developer-specific settings from the ignored .env file when present.
spring.config.import=optional:file:.env[.properties]

# =====================================================
# DATASOURCE
# =====================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quan_ly_phong_tro?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:qlytro}
spring.datasource.password=${DB_PASSWORD:local_qlytro_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================

# Keep the local database schema aligned with entity changes during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

# =====================================================
# THYMELEAF
# =====================================================

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=22MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:admin@123}

# =====================================================
# LOGGING
# =====================================================

logging.level.com.qlytro=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
# Thong tin lien he chu tro
app.contact.phone=${APP_CONTACT_PHONE:}
# Cau hinh thanh toan VietQR
vietqr.bank-id=${VIETQR_BANK_ID:}
vietqr.account-no=${VIETQR_ACCOUNT_NO:}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:}

